# Settings voor Postgres
spring.datasource.url=jdbc:postgresql://localhost:15433/hu-s3-backend
spring.datasource.username=hu-s3-backend-dbadmin
spring.datasource.password=hu-s3-backend-pwd
spring.jpa.hibernate.ddl-auto=create


spring.jpa.properties.hibernate.jdbc.batch_size=100


# Enable JPA query logging
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.nl.hu.s3.project=DEBUG
logging.level.org.springframework.security=TRACE
# Deze setting is controversieel, misschien dat je die in productie uit wil zetten:
spring.web.error.include-message=always